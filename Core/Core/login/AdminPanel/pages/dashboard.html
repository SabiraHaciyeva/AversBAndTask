<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avers Admin - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        .avers-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
        }
        
        .sidebar-item {
            transition: all 0.3s ease;
        }
        
        .sidebar-item:hover, .sidebar-item.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
            color: #1e3a8a;
            border-right: 3px solid #3b82f6;
        }
        
        .stat-card {
            background: white;
            border-radius: 16px;
            border-left: 4px solid;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(30, 58, 138, 0.12);
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-72 bg-white h-screen fixed left-0 top-0 shadow-xl z-50 overflow-y-auto">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 avers-gradient rounded-lg flex items-center justify-center">
                        <i class="fas fa-mountain text-white text-lg"></i>
                    </div>
                    <div>
                        <span class="text-xl font-bold text-slate-800">Avers</span>
                        <p class="text-xs text-slate-500">Admin Panel</p>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 px-4">Əsas Menu</p>
                <ul class="space-y-1">
                    <li>
                        <a href="dashboard.html" class="sidebar-item active flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700 font-medium">
                            <i class="fas fa-home w-5 text-center"></i>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="sliders.html" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:text-slate-900">
                            <i class="fas fa-images w-5 text-center"></i>
                            Slider
                            <!-- <span class="ml-auto bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">3</span> -->
                        </a>
                    </li>
                    <li>
                        <a href="services.html" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:text-slate-900">
                            <i class="fas fa-briefcase w-5 text-center"></i>
                            Xidmətlər
                        </a>
                    </li>
                    <li>
                        <a href="about.html" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:text-slate-900">
                            <i class="fas fa-info-circle w-5 text-center"></i>
                            Haqqımızda
                        </a>
                    </li>
                    <li>
                        <a href="blogs.html" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:text-slate-900">
                            <i class="fas fa-newspaper w-5 text-center"></i>
                            Xəbərlər
                        </a>
                    </li>
                    <li>
                        <a href="teams.html" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:text-slate-900">
                            <i class="fas fa-users w-5 text-center"></i>
                            Komanda
                        </a>
                    </li>
                </ul>

                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 mt-8 px-4">Tənzimləmələr</p>
                <ul class="space-y-1">
                    <li>
                        <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:text-slate-900">
                            <i class="fas fa-cog w-5 text-center"></i>
                            Ümumi Ayarlar
                        </a>
                    </li>
                    <li>
                        <a href="login.html" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50">
                            <i class="fas fa-sign-out-alt w-5 text-center"></i>
                            Çıxış
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-72">
            <!-- Header -->
            <header class="bg-white shadow-sm sticky top-0 z-40 px-8 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex-1 max-w-xl">
                        <div class="relative">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" placeholder="Axtar..." 
                                class="w-full pl-12 pr-4 py-2.5 bg-slate-100 border-0 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-100 transition flex items-center justify-center relative">
                            <i class="fas fa-bell"></i>
                            <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">3</span>
                        </button>
                        <div class="flex items-center gap-3">
                            <div class="text-right hidden sm:block">
                                <p class="text-sm font-semibold text-slate-800">Admin</p>
                                <p class="text-xs text-slate-500">Super Admin</p>
                            </div>
                            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100" 
                                 class="w-10 h-10 rounded-full border-2 border-blue-500 object-cover">
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="p-8">
                <div class="avers-gradient rounded-2xl p-6 mb-8 text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 rounded-full -mr-20 -mt-20"></div>
                    <h2 class="text-2xl font-bold mb-2">Xoşgəldin, Admin! 👋</h2>
                    <p class="text-blue-100">Bugünkü statistika və son yeniliklər.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="stat-card p-6 border-l-blue-500 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-slate-500 text-sm mb-1">Slaydlar</p>
                                <h3 class="text-2xl font-bold text-slate-800">3</h3>
                            </div>
                            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center text-blue-600">
                                <i class="fas fa-images text-lg"></i>
                            </div>
                        </div>
                    </div>
                    <div class="stat-card p-6 border-l-cyan-500 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-slate-500 text-sm mb-1">Xidmətlər</p>
                                <h3 class="text-2xl font-bold text-slate-800">6</h3>
                            </div>
                            <div class="w-12 h-12 bg-cyan-100 rounded-xl flex items-center justify-center text-cyan-600">
                                <i class="fas fa-briefcase text-lg"></i>
                            </div>
                        </div>
                    </div>
                    <div class="stat-card p-6 border-l-indigo-500 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-slate-500 text-sm mb-1">Xəbərlər</p>
                                <h3 class="text-2xl font-bold text-slate-800">12</h3>
                            </div>
                            <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center text-indigo-600">
                                <i class="fas fa-newspaper text-lg"></i>
                            </div>
                        </div>
                    </div>
                    <div class="stat-card p-6 border-l-orange-500 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-slate-500 text-sm mb-1">Komanda</p>
                                <h3 class="text-2xl font-bold text-slate-800">8</h3>
                            </div>
                            <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center text-orange-600">
                                <i class="fas fa-users text-lg"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
